name: Build release archive

# Builds a self-contained Convoro release (vendor/ + public/build/ bundled) so
# it installs on shared hosting with no Composer, no Node, no shell — just
# upload, unzip, and open /install in the browser.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, mbstring, openssl, gd, fileinfo, zip, tokenizer, ctype, bcmath
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_OUTPUT"

      - name: Stage release tree
        run: |
          set -e
          STAGE="convoro"
          rm -rf "$STAGE" && mkdir "$STAGE"
          # Everything tracked, plus the built vendor/ and public/build/.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='convoro' \
            --exclude='storage/app/extensions/*' \
            --exclude='storage/*.key' \
            ./ "$STAGE/"
          # Wipe any local runtime state; keep the directory skeleton + .gitignores.
          rm -f "$STAGE/storage/installed"
          find "$STAGE/storage" -type f \
            ! -name '.gitignore' \
            ! -path '*/framework/*' \
            -path '*/logs/*' -delete || true
          : > "$STAGE/storage/logs/.gitignore" 2>/dev/null || true
          # Ensure a clean .env.example ships.
          test -f "$STAGE/.env.example"

      - name: Create archives
        run: |
          V="${{ steps.ver.outputs.version }}"
          zip -rqy "convoro-${V}.zip" convoro
          tar -czf "convoro-${V}.tar.gz" convoro
          ls -lh convoro-*.zip convoro-*.tar.gz

      - name: Attach archives to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            convoro-${{ steps.ver.outputs.version }}.zip
            convoro-${{ steps.ver.outputs.version }}.tar.gz

      - name: Upload as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: convoro-${{ steps.ver.outputs.version }}
          path: |
            convoro-*.zip
            convoro-*.tar.gz
